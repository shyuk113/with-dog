# 운영(Docker) 실행용 설정. 민감 값은 모두 환경변수로 주입한다.
# 실행 예: docker run -e SPRING_PROFILES_ACTIVE=prod -e JWT_SECRET=... ghcr.io/<owner>/with-dog
spring:
  application:
    name: withdog
  datasource:
    # DB는 utf8mb4로 생성해야 이모지가 포함된 게시글/댓글도 저장된다
    #   CREATE DATABASE withdog CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:withdog}?characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # 커넥션을 못 얻으면 요청 스레드가 오래 막히지 않도록 3초 안에 실패
      connection-timeout: 3000
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동 변경하지 않고 엔티티와 일치하는지만 검사한다
      # 최초 배포처럼 스키마가 없을 때만 JPA_DDL_AUTO=update로 한 번 실행 (이후 Flyway 등 마이그레이션 도구 권장)
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        # LocalDateTime을 한국 시간 기준 그대로 저장/조회
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        # 브로커 장애 시 요청 스레드가 기본값(60초)만큼 막히지 않도록 제한
        max.block.ms: 3000
    consumer:
      auto-offset-reset: earliest

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}

weather:
  base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  service-key: ${WEATHER_SERVICE_KEY:}

route:
  base-url: https://apis.openapi.sk.com
  app-key: ${TMAP_APP_KEY:}

region:
  base-url: https://dapi.kakao.com
  api-key: ${KAKAO_REST_API_KEY:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

# 게시글 이벤트 전달 방식: direct(프로세스 내 즉시 반영) | kafka
feed:
  event:
    transport: ${FEED_EVENT_TRANSPORT:kafka}
